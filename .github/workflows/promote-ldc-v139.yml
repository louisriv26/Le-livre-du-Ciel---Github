name: Promote tested LDC v139 to main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-ldc-v139.yml'

permissions:
  contents: write

concurrency:
  group: ldc-v139-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify predecessor and promote exact tested bytes
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_PREDECESSOR="365d04490411879bdcfa748b3f632dcce88a220c"
          EXPECTED_TREE="b9aaaa762034d9a21398bc8c242c802f59062492"
          SOURCE_COMMIT="5df595cf68330176c5a3d944e18d44d71531bc74"
          SOURCE_PREFIX="ldc-v139-r12-search-v21a-recert"

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PREDECESSOR"

          specs=(
            "corpus/manifest.json|c056b25f6b21112830654a580ef06a6318486077"
            "corpus/search_v21_manifest.json|f2c6f2ce051c20fb096f480df32f55711963c6bb"
            "corpus/search_v21_topology.json|b18b5aa576aa0a0f781ae20b1c32cc9232a208ae"
            "index.html|d6fdd146e0c8256d9394f4d1f7c6d735eec81143"
            "offline_manifest.json|ec1e37df3618531a3bf75f07c369b93e27d809bb"
            "search_worker_v2.js|9ffb397af498e811f76fd4ee2e8a9d533ecaf362"
            "sw.js|e61e17c857044397b23593fe903e9cc8388ce477"
            "version.json|bd89ee5041ea2e0ec1fdbf6a041ee2425c12ed74"
          )

          for spec in "${specs[@]}"; do
            path="${spec%%|*}"
            expected="${spec##*|}"
            mkdir -p "$(dirname "$path")"
            tmp="$(mktemp)"
            url="https://raw.githubusercontent.com/louisriv26/App-Test/${SOURCE_COMMIT}/${SOURCE_PREFIX}/${path}"
            curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$tmp"
            actual="$(git hash-object "$tmp")"
            if [ "$actual" != "$expected" ]; then
              echo "Blob mismatch for $path: $actual != $expected" >&2
              exit 1
            fi
            mv "$tmp" "$path"
          done

          rm -f .github/workflows/promote-ldc-v139.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git add -A
          ACTUAL_TREE="$(git write-tree)"
          if [ "$ACTUAL_TREE" != "$EXPECTED_TREE" ]; then
            echo "Tree mismatch: $ACTUAL_TREE != $EXPECTED_TREE" >&2
            exit 1
          fi

          git config user.name "Collection Luisa Release"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Deploy LDC v139 tested candidate to production"
          git push origin HEAD:main
